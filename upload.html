<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/uploadstyle.css">
    <link rel="stylesheet" href="/style/menu.css">
    <title>Upload Songs CSV</title>
</head>
<body>

    <script>
        function toggleMenu() {
            const navMenu = document.getElementById('navMenu');
            navMenu.classList.toggle('active');
        }
    </script>
    <!-- Hamburger Menu Icon -->
    <div class="hamburger" onclick="toggleMenu()">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <!-- Navigation Menu -->
    <nav class="nav-menu" id="navMenu">
        <ul>
            <li><a href="/index.html">Home</a></li>
            <li><a href="/setlistcreator.html">Setlist Creator</a></li>
            <li><a href="/setlistmanager.html">Setlist Manager</a></li>
            <li><a href="/setlistmanagerprintable.html">Printable Setlist</a></li>
            <li><a href="/songmanager.html">Song Manager</a></li>
            <li><a href="/songmanagerbulk.html">Bulk Song Manager</a></li>
        </ul>
    </nav>

    <div class="upload-container">
        <h1>Upload Songs CSV</h1>
        <form id="upload-form">
            <input type="file" id="csvFile" name="csvFile" accept=".csv" required>
            <label for="overwriteCheckbox">Overwrite existing data:</label>
            <input type="checkbox" id="overwriteCheckbox" name="overwriteCheckbox"><br><br>
            <button type="submit">Upload CSV</button>            
        </form>
        <div id="message"></div>
        <br><br>
        <div>
            <a href="data/setlistsongs.csv" download="setlistsongs.csv">Sample Song File</a>
        </div>
    </div>

    <script type="module">
        import config from './src/config.js';

        document.getElementById('upload-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const csvFile = document.getElementById('csvFile').files[0];
            if (!csvFile) {
                document.getElementById('message').textContent = "Please select a CSV file.";
                return;
            }
            const overwriteCheckbox = document.getElementById('overwriteCheckbox').checked;

            const formData = new FormData();
            formData.append('csvFile', csvFile);
            formData.append('overwrite', overwriteCheckbox ? 'true' : 'false');

            try {
                const uploadUrl = config.uploadUrl;
                console.log('url: ' + uploadUrl);

                const response = await fetch(`${uploadUrl}`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('message').textContent = result.message;
                    document.getElementById('message').className = "message";
                } else {
                    document.getElementById('message').textContent = result.error || 'Failed to upload file.';
                    document.getElementById('message').className = "error";
                }
            } catch (error) {
                alert(error);
                document.getElementById('message').textContent = "Error uploading file.";
                document.getElementById('message').className = "error";
            }
        });
    </script>

</body>
</html>
