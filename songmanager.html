<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/menu.css">
    <title>Setlist Management</title>
    <style>
        .container {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            margin-top: 20px;
        }

        .list-container {
            display: flex;
            justify-content: space-between;
        }

        .song-list {
            border: 1px solid #ccc;
            width: 45%;
            padding: 10px;
        }
        .song-tile {
            padding: 10px;
            margin: 5px;
            border: 1px solid #000;
            cursor: pointer;
        }

        .add-song-container {
            margin-top: 20px;
            width: 75%;
            
        }

        .toggle-status-button{
            background-color: #2980b9;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            border-radius: 5px;
            transition: background-color 0.3s;
            /* Responsive Sizing */
            width: 100%; /* Allow the button to shrink below max width */
            max-width: 100px; /* Maximum width of the button */
        }

        /* Mobile Styles */
        @media (max-width: 900px) {
            .header {
                font-size: 1.5rem; /* Larger text on smaller screens */
            }

            .container {
                padding: 0.5rem; /* Less padding */
            }

            input, button {
                width: 95%; /* Increase width on smaller screens */
            }

            .song-list {
                width: 90%;
            }

        }

        /* Tablet Styles */
        @media (min-width: 901px) and (max-width: 1024px) {
            .header {
                font-size: 2rem; /* Slightly larger text */
            }

            .song-list {
                width: 45%;
            }

        }
    </style>
</head>
<body>
    <script>
        function toggleMenu() {
            const navMenu = document.getElementById('navMenu');
            navMenu.classList.toggle('active');
        }
    </script>
    <!-- Hamburger Menu Icon -->
    <div class="hamburger" onclick="toggleMenu()">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <!-- Navigation Menu -->
    <nav class="nav-menu" id="navMenu">
        <ul>
            <li><a href="/index.html">Home</a></li>
            <li><a href="/setlistcreator.html">Setlist Creator</a></li>
            <li><a href="/setlistmanager.html">Setlist Manager</a></li>
            <li><a href="/setlistmanagerprintable.html">Printable Setlist</a></li>
            <li><a href="/songmanager.html">Song Manager</a></li>
            <li><a href="/songmanagerbulk.html">Bulk Song Manager</a></li>
        </ul>
    </nav>

    <h1>Setlist Management</h1>

    <div class="container">
        <div class="list-container">
            <div class="song-list" style="display: flex; justify-content: center; align-items: center; text-align: center; width: 90%;">
                <div class="add-song-container">
                    <h3>Add New Song</h3>
                    <label for="searchSong">Search Spotify:</label>
                    <input type="text" id="searchSong" placeholder="Enter song name...">
                    <button id="searchSpotifyButton">Search</button>
                    <div id="spotifySearchResults">
                        <!-- Spotify search results will be displayed here -->
                    </div>
                </div>
            </div>
        </div>
      </div>
    </div>

    <div class="container">
        <div class="list-container">
          <div class="song-list">
            <h3 align="center">Active Songs</h3>
            <div id="activeSongsList">
                <!-- Songs marked as active will be listed here -->
            </div>
          </div>

          <div class="song-list">
            <h3 align="center">Inactive Songs</h3>
            <div id="inactiveSongsList">
                <!-- Songs marked as inactive will be listed here -->
            </div>
          </div>
        </div>
    </div>

    <script type="module" src="/src/setlistmanager.js"></script>
</body>
</html>
